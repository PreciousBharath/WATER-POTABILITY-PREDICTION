{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4 text-center">Enter Water Quality Parameters</h2>
<form method="POST" action="/predict">
    <div class="row mb-3">
        {% for col in ['ph','Hardness','Solids','Chloramines','Sulfate','Conductivity','Organic_carbon','Trihalomethanes','Turbidity'] %}
        <div class="col-md-4 mb-3">
            <label class="form-label">{{ col.replace('_', ' ') }}</label>
            <input type="text" class="form-control" name="{{ col }}" placeholder="Enter {{ col.replace('_',' ') }}" required>
        </div>
        {% endfor %}
    </div>
    <div class="text-center">
        <button type="submit" class="btn btn-success btn-lg">Predict Potability</button>
    </div>
</form>
{% endblock %}
